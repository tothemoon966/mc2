<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>maria caroline & maria clara ♥</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
    *{box-sizing:border-box;margin:0;padding:0;}
    body{background:#1a1a2e;}
    .page{
      min-height:100vh;background:#1a1a2e;
      display:flex;flex-direction:column;align-items:center;
      padding:2rem 1rem 2.5rem;font-family:'Press Start 2P',monospace;
      position:relative;overflow:hidden;
    }
    .stars{position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;}
    .star{position:absolute;width:3px;height:3px;background:#fff;animation:twinkle 2s infinite alternate;}
    @keyframes twinkle{0%{opacity:.15}100%{opacity:1}}
    .floating-things{position:absolute;pointer-events:none;top:0;left:0;right:0;bottom:0;}
    .float-item{position:absolute;font-size:22px;animation:floatUp 3s ease-in forwards;}
    @keyframes floatUp{0%{transform:translateY(0) scale(.5);opacity:1}100%{transform:translateY(-220px) scale(1.4);opacity:0}}
    .title{color:#f9d923;font-size:9px;text-align:center;margin-bottom:.4rem;letter-spacing:1px;text-shadow:2px 2px #e94560;line-height:2;}
    .subtitle{color:#ff9de2;font-size:6px;text-align:center;margin-bottom:2rem;letter-spacing:1px;line-height:2;}
    .scene{display:flex;align-items:flex-end;justify-content:center;gap:2rem;margin-bottom:1.2rem;position:relative;}
    .char-wrap{display:flex;flex-direction:column;align-items:center;gap:6px;}
    .hearts-above{display:flex;gap:4px;justify-content:center;min-height:18px;}
    .heart{font-size:13px;animation:floatHeart 2s ease-in-out infinite;display:inline-block;}
    .heart:nth-child(2){animation-delay:.4s}.heart:nth-child(3){animation-delay:.8s}
    @keyframes floatHeart{0%{transform:translateY(0) scale(1);opacity:1}50%{transform:translateY(-8px) scale(1.2);opacity:.8}100%{transform:translateY(0) scale(1);opacity:1}}
    .char-name{font-size:6px;color:#aaa;text-align:center;margin-top:4px;}
    .mid-heart{display:flex;flex-direction:column;align-items:center;gap:5px;padding-bottom:18px;}
    .countdown-wrap{text-align:center;margin-bottom:1.4rem;}
    .countdown-label{color:#888;font-size:6px;margin-bottom:8px;}
    .countdown-grid{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}
    .cunit{display:flex;flex-direction:column;align-items:center;gap:3px;}
    .cnum{color:#f9d923;font-size:13px;text-shadow:1px 1px #e94560;}
    .cname{color:#888;font-size:5px;}
    .cdivider{color:#e94560;font-size:13px;align-self:center;padding-bottom:6px;}
    .msg-box{background:#0d1b2a;border:2px solid #1e3a5f;border-radius:6px;padding:10px 14px;max-width:300px;width:100%;text-align:center;cursor:pointer;margin-bottom:1.2rem;}
    .msg-title{color:#f9d923;font-size:5px;margin-bottom:6px;}
    .msg-text{color:#ff9de2;font-size:6px;line-height:2;transition:color .2s;}
    .msg-text:hover{color:#f9d923;}
    .msg-hint{color:#444;font-size:5px;margin-top:6px;}
    .btn{background:#4a2d6e;color:#ff9de2;border:2px solid #7b4faf;border-radius:4px;padding:9px 16px;font-family:'Press Start 2P',monospace;font-size:7px;cursor:pointer;box-shadow:0 4px 0 #2a1a3e;transition:transform .1s,box-shadow .1s;display:block;margin:0 auto;}
    .btn:active{transform:translateY(3px);box-shadow:0 1px 0 #2a1a3e;}
  </style>
</head>
<body>
<div class="page" id="page">
  <div class="stars" id="stars"></div>
  <div class="floating-things" id="floatingThings"></div>

  <div class="title">DOMINGO, 28/06</div>
  <div class="subtitle">separadas pela via costeira ♥</div>

  <div class="scene">
    <div class="char-wrap">
      <div class="hearts-above">
        <span class="heart">💗</span><span class="heart">💕</span><span class="heart">💗</span>
      </div>
      <canvas id="sprite1" width="20" height="32" style="width:60px;height:96px;image-rendering:pixelated;"></canvas>
      <div class="char-name">maria caroline</div>
    </div>

    <div class="mid-heart">
      <div style="color:#555;font-size:9px;letter-spacing:2px;">·&nbsp;·&nbsp;·</div>
      <div style="color:#e94560;font-size:20px;animation:floatHeart 1s ease-in-out infinite;">♥</div>
      <div style="color:#555;font-size:9px;letter-spacing:2px;">·&nbsp;·&nbsp;·</div>
    </div>

    <div class="char-wrap">
      <div class="hearts-above">
        <span class="heart">💖</span><span class="heart">💓</span><span class="heart">💖</span>
      </div>
      <canvas id="sprite2" width="20" height="32" style="width:60px;height:96px;image-rendering:pixelated;"></canvas>
      <div class="char-name">maria clara</div>
    </div>
  </div>

  <div class="countdown-wrap">
    <div class="countdown-label">nos vemos em ♥</div>
    <div class="countdown-grid">
      <div class="cunit"><span class="cnum" id="cd-d">--</span><span class="cname">dias</span></div>
      <div class="cdivider">:</div>
      <div class="cunit"><span class="cnum" id="cd-h">--</span><span class="cname">horas</span></div>
      <div class="cdivider">:</div>
      <div class="cunit"><span class="cnum" id="cd-m">--</span><span class="cname">min</span></div>
      <div class="cdivider">:</div>
      <div class="cunit"><span class="cnum" id="cd-s">--</span><span class="cname">seg</span></div>
    </div>
  </div>

  <div class="msg-box" id="msg-box" onclick="nextFact()">
    <div class="msg-title">💛 sabia que...</div>
    <div class="msg-text" id="msg-text">clique para descobrir como animais demonstram amor ♥</div>
    <div class="msg-hint">[ clique para próxima curiosidade ]</div>
  </div>

  <button class="btn" onclick="sendLilies()">🌸 mandar lírios 🌸</button>
</div>

<script>
const target = new Date(2026, 5, 28, 18, 30, 0, 0);

function pad(n){ return String(n).padStart(2,'0'); }

function updateCountdown(){
  let diff = target - new Date();
  if(diff <= 0){
    ['cd-d','cd-h','cd-m','cd-s'].forEach(id => document.getElementById(id).textContent = '00');
    document.querySelector('.countdown-label').textContent = 'JÁ CHEGOU O MOMENTO ♥';
    return;
  }
  const d = Math.floor(diff/86400000); diff %= 86400000;
  const h = Math.floor(diff/3600000);  diff %= 3600000;
  const m = Math.floor(diff/60000);    diff %= 60000;
  const s = Math.floor(diff/1000);
  document.getElementById('cd-d').textContent = pad(d);
  document.getElementById('cd-h').textContent = pad(h);
  document.getElementById('cd-m').textContent = pad(m);
  document.getElementById('cd-s').textContent = pad(s);
}
updateCountdown();
setInterval(updateCountdown, 1000);

const facts = [
  "pombos ficam juntos pra sempre e se acariciam com o bico ♡",
  "lontras se dão as patas pra não se separar enquanto dormem 🦦",
  "elefantes consolam os amigos tristes com a tromba 🐘",
  "pinguins presenteiam a parceira com a pedra mais bonita que acham 🐧",
  "coalas de mãe ficam abraçados com os filhotes durante meses 🐨",
  "corvos se lembram pra sempre de quem foi gentil com eles 🐦",
  "lobos lambem o rosto dos companheiros pra mostrar afeto 🐺",
  "golfinhos chamam uns aos outros pelo nome pra se encontrar 🐬",
  "girafas entrelaçam o pescoço em forma de abraço 🦒",
  "chimpanzés consolam os amigos abraçando quando estão tristes 🐒",
];
let factIdx = 0;
function nextFact(){
  document.getElementById('msg-text').textContent = facts[factIdx % facts.length];
  factIdx++;
}

function sendLilies(){
  const container = document.getElementById('floatingThings');
  const items = ['🌸','🌷','💐','🌺','🤍','💜','🌸','🌷'];
  for(let i = 0; i < 10; i++){
    setTimeout(() => {
      const el = document.createElement('div');
      el.className = 'float-item';
      el.textContent = items[Math.floor(Math.random() * items.length)];
      el.style.left = (Math.random() * 80 + 10) + '%';
      el.style.bottom = (Math.random() * 20 + 5) + '%';
      el.style.animationDuration = (2 + Math.random()) + 's';
      container.appendChild(el);
      setTimeout(() => el.remove(), 3500);
    }, i * 100);
  }
}

const starsEl = document.getElementById('stars');
for(let i = 0; i < 40; i++){
  const s = document.createElement('div');
  s.className = 'star';
  s.style.left = Math.random() * 100 + '%';
  s.style.top = Math.random() * 100 + '%';
  s.style.animationDelay = Math.random() * 2 + 's';
  s.style.animationDuration = (1.5 + Math.random() * 2) + 's';
  starsEl.appendChild(s);
}

function px(ctx, x, y, color, w=1, h=1){
  ctx.fillStyle = color;
  ctx.fillRect(x, y, w, h);
}

function drawVoce(){
  const c = document.getElementById('sprite1');
  const ctx = c.getContext('2d');
  ctx.clearRect(0, 0, 20, 32);
  const skin='#8B5E3C', hair='#3B1F0A', coat='#C9912A', pants='#5a3a1a', shoe='#2a1a0a', phone='#222', screen='#7ecfff', eye='#1a0a00';

  px(ctx,4,0,hair,12,1);
  px(ctx,3,1,hair,14,2);
  px(ctx,3,3,hair,3,1); px(ctx,14,3,hair,3,1);
  px(ctx,3,3,hair,14,1);
  px(ctx,4,3,skin,12,5);
  px(ctx,4,3,hair,12,1);
  px(ctx,6,5,eye,2,2); px(ctx,12,5,eye,2,2);
  px(ctx,10,7,'#7a4020',1,1);
  px(ctx,8,8,'#c07060',4,1);
  px(ctx,3,5,skin,1,2); px(ctx,16,5,skin,1,2);
  px(ctx,8,8,skin,4,2);
  px(ctx,2,10,coat,16,8);
  px(ctx,0,10,coat,3,7);
  px(ctx,17,10,coat,3,7);
  px(ctx,0,16,skin,2,2);
  px(ctx,0,15,phone,3,5);
  px(ctx,1,16,screen,1,3);
  px(ctx,17,16,skin,2,2);
  px(ctx,4,18,pants,12,7);
  px(ctx,9,20,'#3a2a0a',2,5);
  px(ctx,4,25,shoe,5,2); px(ctx,11,25,shoe,5,2);
  px(ctx,3,8,hair,2,4); px(ctx,15,8,hair,2,4);
}

function drawEla(){
  const c = document.getElementById('sprite2');
  const ctx = c.getContext('2d');
  ctx.clearRect(0, 0, 20, 32);
  const skin='#F5D5C0', hair='#E87FAB', dress='#1a1a1a', shoe='#111', phone='#222', screen='#7ecfff', eye='#2a1a2a', cheek='#f0a8a0';

  px(ctx,3,0,hair,14,1);
  px(ctx,2,1,hair,16,3);
  px(ctx,1,2,hair,18,5);
  px(ctx,1,4,hair,3,4); px(ctx,16,4,hair,3,4);
  px(ctx,2,5,hair,2,2); px(ctx,16,5,hair,2,2);
  px(ctx,4,4,skin,12,5);
  px(ctx,6,5,eye,2,2); px(ctx,12,5,eye,2,2);
  px(ctx,5,7,cheek,2,1); px(ctx,13,7,cheek,2,1);
  px(ctx,8,8,'#d06070',4,1);
  px(ctx,3,5,skin,1,2); px(ctx,16,5,skin,1,2);
  px(ctx,8,9,skin,4,2);
  px(ctx,3,11,dress,14,10);
  px(ctx,1,17,dress,18,7);
  px(ctx,1,11,dress,3,6);
  px(ctx,16,11,dress,3,6);
  px(ctx,0,15,skin,2,2);
  px(ctx,0,14,phone,3,5);
  px(ctx,1,15,screen,1,3);
  px(ctx,17,15,skin,2,2);
  px(ctx,4,24,shoe,5,3); px(ctx,11,24,shoe,5,3);
  px(ctx,2,1,hair,4,2); px(ctx,14,1,hair,4,2);
}

drawVoce();
drawEla();
</script>
</body>
</html>
